<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>btc15 trade caller</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--fg:#e8edf3;--mut:#8b97a6;--up:#1fbf75;--dn:#f0506e;--skip:#6b7685;--ok:#1fbf75;--bad:#f0506e;--warn:#e6b422}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:12px 16px 40px}
.banner{position:sticky;top:0;z-index:9;text-align:center;font-weight:800;letter-spacing:.08em;padding:8px;color:#fff}
.banner.live{background:#d11a2a}.banner.demo{background:#2d6cdf}.banner.paper{background:#3b4452}
.halt{background:var(--bad);color:#fff;padding:10px;border-radius:8px;margin:10px 0;font-weight:700}
.card{background:var(--card);border-radius:12px;padding:14px;margin:12px 0}
.big{font-size:44px;font-weight:900;text-align:center;letter-spacing:.02em}
.sub{text-align:center;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;justify-content:center}
.chip{font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid #2b3340}
.chip.pass{color:var(--ok);border-color:#1f5b40}.chip.fail{color:var(--bad);border-color:#6b2434;font-weight:700}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:6px 4px;border-bottom:1px solid #222a35;font-size:14px}
th{color:var(--mut);font-weight:600}.num{font-variant-numeric:tabular-nums}
h2{margin:0 0 8px;font-size:16px;color:var(--mut);font-weight:600}
button.kill{width:100%;padding:14px;font-size:16px;font-weight:800;background:#a3182b;color:#fff;border:0;border-radius:10px}
.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}
.modal .box{background:var(--card);padding:20px;border-radius:12px;max-width:380px;width:100%}
.modal button{padding:10px 14px;border-radius:8px;border:0;font-weight:700;margin-right:8px}
a{color:#7db4ff}.pos{color:var(--up)}.neg{color:var(--dn)}
</style></head><body>
<div class="banner {{ mode|lower }}">{% if mode == 'LIVE' %}● LIVE — REAL MONEY ●{% elif mode == 'DEMO' %}DEMO (Kalshi demo environment){% else %}PAPER — simulated fills{% endif %}</div>
<div class="wrap">
<nav><a href="/">Live</a> · <a href="/calibration">Calibration</a> · <a href="/export.csv">CSV</a></nav>
{% block body %}{% endblock %}
</div></body></html>
