[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "btc15-trade-caller"
version = "0.1.0"
description = "Kalshi KXBTC15M analyzer and executor with strict risk controls"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "websockets>=12",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "pydantic-settings>=2.2",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
btc15 = "btc15.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
btc15 = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
